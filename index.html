<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Utama — FBI Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1E23;
    --surface: #22262D;
    --surface-raised: #282D35;
    --border: #383D46;
    --border-soft: #2F343C;
    --text: #E8E6E1;
    --text-dim: #9198A3;
    --text-faint: #5E6570;
    --accent: #E8A33D;
    --accent-dim: #B5822F;
    --accent-bg: rgba(232,163,61,0.1);
    --danger: #D96B5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .masthead{
    padding: 22px 28px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  .masthead h1{
    font-size:20px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .masthead p{
    margin:0;
    color:var(--text-dim);
    font-size:13.5px;
  }

  .tabs{
    display:flex;
    gap:4px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    overflow-x:auto;
    flex-shrink:0;
    background: var(--surface);
  }
  .tab{
    padding: 13px 16px;
    font-size:13.5px;
    color: var(--text-dim);
    background:transparent;
    border:none;
    border-bottom: 2px solid transparent;
    cursor:pointer;
    white-space:nowrap;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .tab:hover{ color: var(--text); }
  .tab.active{
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .stage{
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .frame-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
    font-size:12px;
    color:var(--text-faint);
    flex-shrink:0;
  }
  .frame-bar .url{
    font-family:'IBM Plex Mono', monospace;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:60%;
  }
  .open-new{
    color: var(--accent);
    text-decoration:none;
    font-size:12.5px;
    border:1px solid var(--border);
    padding:5px 11px;
    border-radius:6px;
    white-space:nowrap;
  }
  .open-new:hover{ border-color: var(--accent-dim); }

  .frame-wrap{
    flex:1;
    position:relative;
    background: var(--surface-raised);
  }
  iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }

  .fallback{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px;
    color: var(--text-dim);
    background: var(--surface-raised);
  }
  .fallback.show{ display:flex; }
  .fallback strong{
    color: var(--text);
    font-size:15px;
    display:block;
    margin-bottom:8px;
  }
  .fallback p{ max-width:44ch; font-size:13.5px; margin: 0 0 18px; }
  .fallback a.btn{
    background: var(--accent);
    color:#20180a;
    text-decoration:none;
    padding:9px 20px;
    border-radius:6px;
    font-weight:600;
    font-size:14px;
  }

  @media (max-width: 640px){
    .frame-bar .url{ display:none; }
  }
</style>
</head>
<body>

  <div class="masthead">
    <h1>Dashboard Utama</h1>
    <p>Akses semua menu operasional dari satu tempat.</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="stage">
    <div class="frame-bar">
      <span class="url" id="currentUrl">—</span>
      <a class="open-new" id="openNewBtn" href="#" target="_blank" rel="noopener noreferrer">Buka di tab baru ↗</a>
    </div>
    <div class="frame-wrap">
      <iframe id="mainFrame" src="" title="menu"></iframe>
      <div class="fallback" id="fallback">
        <strong>Menu tidak bisa ditampilkan di sini</strong>
        <p>Google Apps Script ini memblokir tampilan iframe secara default. Buka langsung di tab baru, atau lihat catatan di bawah dashboard untuk cara mengizinkannya.</p>
        <a class="btn" id="fallbackOpen" href="#" target="_blank" rel="noopener noreferrer">Buka menu ini</a>
      </div>
    </div>
  </div>

<script>
  // Daftar menu — tinggal tambah/edit di sini
  const menus = [
    {
      name: "FBI Maintenance Expired",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbxkN3DDLjkNWtomy4o24L75s0q0wg_XFd1nTcL_tEReu0U_3n-akzuqcuaxJJYSHEh9cg/exec"
    },
    {
      name: "Dashboard Picking",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbwuX1OOs38R371rD2s5X8wOejX80HWUozSMN5_3LXLaMc9iVY5eA9YkD6jO6lpdiHbb/exec"
    },
    {
      name: "Update Area Kerja FBI",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbymV0wpEPhQZGqHJIPAtb_bXYYWnMRQPsrnzX3iO9tff_aDm9JmaduiB3NbN70WoSEIeg/exec"
    },
    {
      name: "Dashboard Update Stock Molly",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbwf8rMfHmdikUIBVt65DPJcUD-hxVJmv7U1cf5AeOxkb-hD-y94-OWd1Ny2ArhK2dxY/exec"
    }
  ];

  const tabsEl = document.getElementById('tabs');
  const frame = document.getElementById('mainFrame');
  const currentUrl = document.getElementById('currentUrl');
  const openNewBtn = document.getElementById('openNewBtn');
  const fallback = document.getElementById('fallback');
  const fallbackOpen = document.getElementById('fallbackOpen');

  let activeIndex = 0;
  let loadTimer = null;

  function renderTabs(){
    tabsEl.innerHTML = '';
    menus.forEach((m, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (i === activeIndex ? ' active' : '');
      btn.textContent = m.name;
      btn.onclick = () => selectTab(i);
      tabsEl.appendChild(btn);
    });
  }

  function selectTab(i){
    activeIndex = i;
    renderTabs();
    loadMenu(menus[i]);
  }

  function loadMenu(menu){
    fallback.classList.remove('show');
    currentUrl.textContent = menu.url;
    openNewBtn.href = menu.url;
    fallbackOpen.href = menu.url;
    frame.src = menu.url;

    // Apps Script yang menolak iframe biasanya gagal load tanpa error JS yang
    // bisa dideteksi (X-Frame-Options). Kita pakai timeout sederhana sebagai indikasi.
    clearTimeout(loadTimer);
    let loaded = false;
    frame.onload = () => { loaded = true; };
    loadTimer = setTimeout(() => {
      if (!loaded) fallback.classList.add('show');
    }, 4000);
  }

  renderTabs();
  loadMenu(menus[activeIndex]);
</script>
</body>
</html>
