<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Utama — FBI Ops</title>
<link rel="icon" type="image/png" href="Chatime_TeaBaby.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #2B1A45;
    --surface: #37225A;
    --surface-raised: #422A68;
    --border: #6B3F8C;
    --border-soft: #5A3679;
    --text: #F1EAFB;
    --text-dim: #D9C4EE;
    --text-faint: #B79BD4;
    --accent: #FFFFFF;
    --accent-dim: #E8D4F7;
    --accent-bg: rgba(255,255,255,0.16);
    --danger: #F08C7D;
    --gradient: linear-gradient(155deg, #2B1A45 0%, #7C2E9E 45%, #C874D9 75%, #F6ECFB 100%);
    --panel-bg: rgba(30,17,51,0.62);
    --panel-bg-soft: rgba(30,17,51,0.5);
    --btn-text: #20180a;
  }
  body.light{
    --bg: #FAF6FD;
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --border: #DFC9EF;
    --border-soft: #EAD9F4;
    --text: #2B1A45;
    --text-dim: #6B4C8A;
    --text-faint: #9B84B8;
    --accent: #8A2FB0;
    --accent-dim: #6B2088;
    --accent-bg: rgba(138,47,176,0.1);
    --danger: #C94B3D;
    --gradient: linear-gradient(155deg, #FAF3FD 0%, #EBD1F5 40%, #C874D9 75%, #7C2E9E 100%);
    --panel-bg: rgba(255,255,255,0.7);
    --panel-bg-soft: rgba(255,255,255,0.65);
    --btn-text: #FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    background: var(--gradient);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:row;
    transition: background .25s ease, color .25s ease;
  }

  .sidebar{
    width: 240px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    border-right: 1px solid var(--border);
    background: var(--panel-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    height:100vh;
    position:sticky;
    top:0;
    transition: width .18s ease, opacity .18s ease;
    overflow:hidden;
  }
  .sidebar.collapsed{
    width:0;
    opacity:0;
    border-right:none;
  }
  .masthead{
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .masthead-text{ min-width:0; }
  .brand-logo{
    height:34px;
    width:auto;
    display:block;
    margin-bottom:10px;
    object-fit:contain;
  }
  .masthead h1{
    font-size:18px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:-0.01em;
    white-space:nowrap;
  }
  .masthead p{
    margin:0;
    color:var(--text-dim);
    font-size:12.5px;
  }
  .marquee-wrap{
    overflow:hidden;
    white-space:nowrap;
    width:100%;
  }
  .marquee-text{
    display:inline-block;
    margin:0;
    color:var(--text-dim);
    font-size:12.5px;
    padding-left:100%;
    animation: marquee-scroll 9s linear infinite;
  }
  @keyframes marquee-scroll{
    0%{ transform: translateX(0); }
    100%{ transform: translateX(-100%); }
  }
  .sidebar-toggle{
    flex-shrink:0;
    width:26px;
    height:26px;
    border-radius:6px;
    border:1px solid var(--border);
    background:transparent;
    color: var(--text-dim);
    cursor:pointer;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sidebar-toggle:hover{ color: var(--accent); border-color: var(--accent-dim); }

  .show-sidebar-btn{
    position:fixed;
    top:16px;
    left:16px;
    z-index:20;
    width:34px;
    height:34px;
    border-radius:8px;
    border:1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor:pointer;
    font-size:15px;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .show-sidebar-btn.show{ display:flex; }
  .show-sidebar-btn:hover{ color: var(--accent); border-color: var(--accent-dim); }

  .tabs{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding: 12px;
    overflow-y:auto;
    flex:1;
    background: transparent;
  }
  .tab{
    padding: 11px 14px;
    font-size:13.5px;
    color: var(--text-dim);
    background:transparent;
    border:none;
    border-left: 2px solid transparent;
    border-radius:6px;
    cursor:pointer;
    text-align:left;
    white-space:normal;
    line-height:1.35;
    font-family:'IBM Plex Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .tab:hover{ color: var(--text); background: var(--surface-raised); }
  .tab.active{
    color: var(--accent);
    background: var(--accent-bg);
    border-left-color: var(--accent);
  }
  .tab .ext-icon{
    flex-shrink:0;
    font-size:12px;
    opacity:0.7;
  }

  .stage{
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-width:0;
  }
  .frame-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 20px;
    background: var(--panel-bg-soft);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-soft);
    font-size:12px;
    color:var(--text-faint);
    flex-shrink:0;
  }
  .frame-bar .url{
    font-family:'IBM Plex Mono', monospace;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:60%;
  }
  .open-new{
    color: var(--accent);
    text-decoration:none;
    font-size:12.5px;
    border:1px solid var(--border);
    padding:5px 11px;
    border-radius:6px;
    white-space:nowrap;
  }
  .open-new:hover{ border-color: var(--accent-dim); }

  .fullscreen-btn{
    width:26px;
    height:26px;
    border-radius:6px;
    border:1px solid var(--border);
    background:transparent;
    color: var(--text-dim);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:14px;
  }
  .fullscreen-btn:hover{ color: var(--accent); border-color: var(--accent-dim); }
  .live-clock{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color: var(--text-faint);
    margin-right:14px;
    white-space:nowrap;
    text-align:right;
    min-width:190px;
  }

  .frame-wrap{
    flex:1;
    position:relative;
    background: var(--surface-raised);
    overflow:auto;
  }
  .image-view{
    width:100%;
    min-height:100%;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:24px;
    background: #FFFFFF;
  }
  .image-view img{
    max-width:100%;
    height:auto;
    border-radius:8px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  }
  iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }

  .fallback{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px;
    color: var(--text-dim);
    background: var(--surface-raised);
  }
  .fallback.show{ display:flex; }
  .fallback strong{
    color: var(--text);
    font-size:15px;
    display:block;
    margin-bottom:8px;
  }
  .fallback p{ max-width:44ch; font-size:13.5px; margin: 0 0 18px; }
  .fallback a.btn{
    background: var(--accent);
    color: var(--btn-text);
    text-decoration:none;
    padding:9px 20px;
    border-radius:6px;
    font-weight:600;
    font-size:14px;
  }

  @media (max-width: 640px){
    .frame-bar .url{ display:none; }
    .live-clock{ display:none; }
    body{ flex-direction:column; }
    .sidebar{
      width:100%;
      height:auto;
      position:relative;
      border-right:none;
      border-bottom: 1px solid var(--border);
    }
    .sidebar.collapsed{
      width:100%;
      height:0;
      opacity:0;
      border-bottom:none;
    }
    .tabs{
      flex-direction:row;
      overflow-x:auto;
      overflow-y:visible;
    }
    .tab{ white-space:nowrap; }
    .show-sidebar-btn{ top:10px; left:10px; }
  }
</style>
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="masthead">
      <div class="masthead-text">
        <img src="Chatime-Logo.png" alt="Chatime" class="brand-logo">
        <h1>Dashboard Utama</h1>
        <div class="marquee-wrap">
          <p class="marquee-text">Akses semua menu operasional proses</p>
        </div>
      </div>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <button class="sidebar-toggle" id="hideSidebarBtn" title="Sembunyikan sidebar">⟨</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <button class="show-sidebar-btn" id="showSidebarBtn" title="Tampilkan sidebar">☰</button>

  <div class="stage">
    <div class="frame-bar">
      <span class="url" id="currentUrl">—</span>
      <div style="display:flex; align-items:center;">
        <span class="live-clock" id="liveClock">—</span>
        <button class="fullscreen-btn" id="refreshBtn" title="Muat ulang menu ini">⟳</button>
        <button class="fullscreen-btn" id="themeToggleBtn" title="Ganti tema gelap/terang">☾</button>
        <button class="fullscreen-btn" id="fullscreenBtn" title="Perbesar layar penuh">⛶</button>
        <a class="open-new" id="openNewBtn" href="#" target="_blank" rel="noopener noreferrer">Buka di tab baru ↗</a>
      </div>
    </div>
    <div class="frame-wrap">
      <iframe id="mainFrame" src="" title="menu"></iframe>
      <div class="image-view" id="imageView" style="display:none;">
        <img id="imageEl" src="" alt="Struktur Organisasi">
      </div>
      <div class="fallback" id="fallback">
        <strong>Menu tidak bisa ditampilkan di sini</strong>
        <p>Google Apps Script ini memblokir tampilan iframe secara default. Buka langsung di tab baru, atau lihat catatan di bawah dashboard untuk cara mengizinkannya.</p>
        <a class="btn" id="fallbackOpen" href="#" target="_blank" rel="noopener noreferrer">Buka menu ini</a>
      </div>
    </div>
  </div>

<script>
  // Daftar menu — tinggal tambah/edit di sini
  // Tambahkan "openInNewTab: true" pada menu yang gagal menampilkan data
  // di dalam iframe (biasanya karena Apps Script butuh sesi login Google
  // yang terblokir saat berada dalam nested-iframe / cookie pihak ketiga).
  const menus = [
    {
      name: "Dashboard Picking",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbwuX1OOs38R371rD2s5X8wOejX80HWUozSMN5_3LXLaMc9iVY5eA9YkD6jO6lpdiHbb/exec"
    },
    {
      name: "Update Area Kerja FBI",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbymV0wpEPhQZGqHJIPAtb_bXYYWnMRQPsrnzX3iO9tff_aDm9JmaduiB3NbN70WoSEIeg/exec"
    },
    {
      name: "FBI Maintenance Expired",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbyxP5Dom6pcsiLiPx8Kih6a1uFIrrFlm8MQjmVRAHO3g87Bi4pDvRXkfhzkxH5rF40w_g/exec"
    },
    {
      name: "Dashboard Update Stock Molly",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbwf8rMfHmdikUIBVt65DPJcUD-hxVJmv7U1cf5AeOxkb-hD-y94-OWd1Ny2ArhK2dxY/exec"
    },
    {
      name: "Replenish FBI",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbwymtqge1vey6prfHqFL3m-k6MmKQfqeHZtAxozdoxThcoCdTR39_hnJEVlL3Vg521sPQ/exec"
    },
    {
      name: "Struktur Organisasi FBI",
      type: "image",
      url: "struktur-organisasi (1).png"
    },
    {
      name: "Lokasi Maintenance Area 3",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbw6NPTaj4_QjotWuehYOSiaZS29gD8w1V-FvUIgbk2S-HbNw0H5t5SI5MdOcpfkK7Y/exec"
    },
    {
      name: "TEMUAN CASE INTERNAL",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbzaX2RtDT7hJg9mFYDgv3l3cKHPslpJvlhpgrIxHehLMmmFt4tBAv4t99sA-VKPoNWWXA/exec"
    },
    {
      name: "Dashboard Picking & Putaway",
      url: "https://script.google.com/a/macros/kawanlamacorp.com/s/AKfycbzPORxmvc_ztsOF4wYOb7KENeURyyv_nqRVHKX2iTIKupLREdn56vFspe2PEoWVocBd/exec"
    }
  ];

  const tabsEl = document.getElementById('tabs');
  const frame = document.getElementById('mainFrame');
  const currentUrl = document.getElementById('currentUrl');
  const openNewBtn = document.getElementById('openNewBtn');
  const fallback = document.getElementById('fallback');
  const fallbackOpen = document.getElementById('fallbackOpen');
  const imageView = document.getElementById('imageView');
  const imageEl = document.getElementById('imageEl');
  const sidebar = document.getElementById('sidebar');
  const hideSidebarBtn = document.getElementById('hideSidebarBtn');
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const liveClock = document.getElementById('liveClock');

  function updateClock(){
    const now = new Date();
    const tanggal = now.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    const waktu = now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    liveClock.textContent = `${tanggal}, ${waktu}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  themeToggleBtn.addEventListener('click', () => {
    const isLight = document.body.classList.toggle('light');
    themeToggleBtn.textContent = isLight ? '☀' : '☾';
    themeToggleBtn.title = isLight ? 'Ganti ke tema gelap' : 'Ganti ke tema terang';
  });
  const showSidebarBtn = document.getElementById('showSidebarBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', () => {
    fullscreenBtn.textContent = document.fullscreenElement ? '⤢' : '⛶';
    fullscreenBtn.title = document.fullscreenElement ? 'Keluar layar penuh' : 'Perbesar layar penuh';
  });

  hideSidebarBtn.addEventListener('click', () => {
    sidebar.classList.add('collapsed');
    showSidebarBtn.classList.add('show');
  });
  showSidebarBtn.addEventListener('click', () => {
    sidebar.classList.remove('collapsed');
    showSidebarBtn.classList.remove('show');
  });

  let activeIndex = 0;
  let loadTimer = null;

  function renderTabs(){
    tabsEl.innerHTML = '';
    menus.forEach((m, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (i === activeIndex ? ' active' : '');
      const label = document.createElement('span');
      label.textContent = m.name;
      btn.appendChild(label);
      if (m.openInNewTab){
        const icon = document.createElement('span');
        icon.className = 'ext-icon';
        icon.textContent = '↗';
        icon.title = 'Membuka di tab baru';
        btn.appendChild(icon);
      }
      btn.onclick = () => selectTab(i);
      tabsEl.appendChild(btn);
    });
  }

  function selectTab(i){
    const menu = menus[i];

    // Menu yang ditandai openInNewTab langsung dibuka di tab baru dan
    // TIDAK memuat apapun ke dalam iframe utama — tampilan dashboard
    // (frame yang sedang aktif) tetap seperti sebelumnya.
    if (menu.openInNewTab){
      window.open(menu.url, '_blank', 'noopener,noreferrer');
      return;
    }

    activeIndex = i;
    renderTabs();
    loadMenu(menu);
  }

  function loadMenu(menu){
    fallback.classList.remove('show');
    clearTimeout(loadTimer);

    if (menu.type === 'image'){
      frame.style.display = 'none';
      imageView.style.display = 'flex';
      imageEl.src = menu.url;
      currentUrl.textContent = menu.name;
      openNewBtn.href = menu.url;
      return;
    }

    imageView.style.display = 'none';
    frame.style.display = 'block';
    currentUrl.textContent = menu.url;
    openNewBtn.href = menu.url;
    fallbackOpen.href = menu.url;
    frame.src = menu.url;

    // Apps Script yang menolak iframe biasanya gagal load tanpa error JS yang
    // bisa dideteksi (X-Frame-Options). Kita pakai timeout sederhana sebagai indikasi.
    let loaded = false;
    frame.onload = () => { loaded = true; };
    loadTimer = setTimeout(() => {
      if (!loaded) fallback.classList.add('show');
    }, 4000);
  }

  refreshBtn.addEventListener('click', () => {
    const menu = menus[activeIndex];
    if (!menu || menu.openInNewTab) return;

    if (menu.type === 'image'){
      // Cache-bust supaya gambar benar-benar dimuat ulang, bukan dari cache
      imageEl.src = menu.url + (menu.url.includes('?') ? '&' : '?') + '_r=' + Date.now();
      return;
    }

    loadMenu(menu);
  });

  renderTabs();
  loadMenu(menus[activeIndex]);
</script>
</body>
</html>
